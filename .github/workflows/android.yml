name: Android tablet

on:
  push:
    branches: ["claude/**", main]
    paths:
      - "android/**"
      - "scripts/android/**"
      - "app/**"
      - "components/**"
      - "src/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/android/**"
      - "app/**"
      - "components/**"
      - "src/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  LIBNODE_TAG: v24.20.0-0

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-server.mjs
      - name: Build Android server payload (server.zip)
        run: node scripts/android/build-payload.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache libnode
        id: libnode-cache
        uses: actions/cache@v4
        with:
          path: android/libnode
          key: libnode-${{ env.LIBNODE_TAG }}-${{ hashFiles('scripts/android/fetch-libnode.sh') }}
      - name: Fetch libnode (nodejs-mobile ${{ env.LIBNODE_TAG }})
        if: steps.libnode-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$LIBNODE_TAG" -R digidem/nodejs-mobile --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
          bash scripts/android/fetch-libnode.sh

      - name: Prepare Android SDK (licenses, platform, CMake, NDK)
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          NDK="$(ls "$ANDROID_HOME/ndk" 2>/dev/null | grep '^27\.' | sort -V | tail -1 || true)"
          if [ -z "$NDK" ]; then
            "$SDKM" "ndk;27.3.13750724"
            NDK=27.3.13750724
          fi
          echo "Using NDK $NDK"
          echo "NDK_VERSION=$NDK" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PndkVersion="$NDK_VERSION"

      - name: Check native library alignment (informational)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | grep -E 'lib/.*\.so' || true
          "$BT/zipalign" -c -P 16 4 "$APK" && echo "16 KB zipalign OK" || echo "WARNING: not 16 KB aligned"

      - uses: actions/upload-artifact@v7
        with:
          name: learnharness-tablet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: Emulator smoke (API 34, x86_64 tablet)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: learnharness-tablet-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          cores: 4
          ram-size: 4096M
          disk-size: 8192M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android/emulator-smoke.sh apk/app-debug.apk smoke-out

      - name: Collect logcat if the smoke step died early
        if: always()
        run: ls -la smoke-out 2>/dev/null || echo "no smoke-out"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: learnharness-tablet-smoke
          path: smoke-out/
          if-no-files-found: warn
          retention-days: 14
